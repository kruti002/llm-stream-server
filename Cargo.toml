# Workspace manifest for the llm-stream-server project.
#
# Milestone 1 only needs the `core` crate, but the workspace table is set up so
# the future member crates named in the project spec (server, py, bench, ffi)
# can be dropped into `crates/` and added to `members` without reshaping the
# project. Shared dependency versions live in `[workspace.dependencies]` so that
# every crate pins the same version of tokio/serde/etc. from one place — this
# keeps the dependency graph consistent and avoids accidental version skew once
# more crates are added.
[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/py"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

# Centralized dependency versions. Member crates opt in with
# `dep = { workspace = true }` (plus any crate-specific feature list).
[workspace.dependencies]
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures = { version = "0.3", default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = "1"

# --- HTTP client (core: OllamaBackend) ---
# `reqwest` with default features DISABLED. The defaults pull native-tls
# (OpenSSL on Linux, SChannel/Security.framework elsewhere); on this GNU/MinGW
# Windows toolchain there is no MSVC/OpenSSL build chain, so we opt out of all
# defaults and turn on only:
#   * json   — (de)serialize request/response bodies with serde_json
#   * stream — expose the response body as a `futures::Stream` of byte chunks,
#              which is what lets us parse Ollama's NDJSON incrementally and
#              cancel mid-stream by dropping the stream
#   * rustls-tls — a pure-Rust TLS stack (ring-based) so nothing links OpenSSL;
#              this keeps cross-platform builds (and the GNU toolchain) simple.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# --- HTTP server (server crate) ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
